# MambaBot behind nginx: example.com -> 127.0.0.1:3400. Replace example.com with your domain,
# get a certificate (e.g. certbot --webroot -w /var/www/certbot -d example.com -d www.example.com)
# and install as /etc/nginx/conf.d/<your domain>.conf.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # The app is never served over plain HTTP.
    location / {
        return 301 https://example.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name example.com;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mambabot_ssl:5m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 128k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Never reachable from outside: Claude runs talk to it on 127.0.0.1:3400 directly.
    location ^~ /internal/ {
        return 404;
    }

    # Live browser view: authenticated WebSocket (the app checks cookie, Origin and Host).
    location = /api/browser/vnc {
        proxy_pass http://127.0.0.1:3400;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Attachments: up to 20 MB, streamed to the app.
    location = /api/uploads {
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3400;
        proxy_read_timeout 300s;
    }

    # Server-sent events: no buffering, long-lived.
    location = /api/browser/events {
        proxy_pass http://127.0.0.1:3400;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/api/conversations/[0-9a-f-]+/events$ {
        proxy_pass http://127.0.0.1:3400;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_read_timeout 120s;
    }
}
