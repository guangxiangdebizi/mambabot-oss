<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>分享的对话</title>
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/share.js"></script>
</head>
<body class="share-page">
  <header class="share-head">
    <img src="/icon.svg" alt="" width="28" height="28">
    <span class="share-brand">MambaBot</span>
    <span class="share-tag">只读分享</span>
  </header>
  <main class="share-main">
    <h1 id="share-title" class="share-title">加载中…</h1>
    <p id="share-meta" class="share-meta"></p>
    <div id="share-messages" class="messages share-messages"></div>
    <p class="share-foot">这是对话在分享时刻的只读快照，不包含附件文件和操作细节。</p>
  </main>
</body>
</html>
